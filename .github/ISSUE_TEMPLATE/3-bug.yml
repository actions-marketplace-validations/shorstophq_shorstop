name: Bug
description: A crash, an error, wrong report formatting, or a problem installing or with the GitHub Action.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For a detection that's missing or wrong, use the "Missed detection" form instead.
        For a security vulnerability in ShorStop, report it privately (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the full error message.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      description: The command or workflow YAML you ran, and the input if it's small.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `shorstop version`, or the Action ref (`shorstophq/shorstop@v0.1.3`).
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - GitHub Action
        - Homebrew
        - Docker image
        - Release archive
        - go install
        - Built from source
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and architecture
      placeholder: macOS 15 arm64, Ubuntu 24.04 amd64, Windows 11...
