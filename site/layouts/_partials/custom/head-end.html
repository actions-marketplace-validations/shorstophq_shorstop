{{- /* Site-wide CSS tweaks, loaded by Hextra at the end of <head>. */ -}}
<style>
  /* Show "--flag" as two hyphens: the code font otherwise joins them into a
     dash, and readers copy what they see. */
  code, pre, kbd { font-variant-ligatures: none; }
  /* Rule IDs are long and hyphenated; keep each on one line in tables. */
  .content table td:first-child code { white-space: nowrap; }
</style>
